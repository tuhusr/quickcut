<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: qc-media:; media-src 'self' file: qc-media: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'" />
  <title>Quickcut</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app" data-empty="true">
    <header class="topbar">
      <div class="brand" aria-label="Quickcut">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M19 4v16M5 12h6m2 0h6" /></svg>
        <span>Quickcut</span>
      </div>
      <label class="edit-name">
        <span class="sr-only">Edit name</span>
        <input id="editName" value="Untitled edit" spellcheck="false" autocomplete="off" />
      </label>
      <div class="topbar-actions">
        <button class="icon-btn" id="undoBtn" data-tip="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg data-icon="undo"></svg></button>
        <button class="icon-btn" id="redoBtn" data-tip="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg data-icon="redo"></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <button class="icon-btn" id="newBtn" data-tip="New edit: clear everything and start fresh (Ctrl+N). Your video files aren’t touched." aria-label="New edit"><svg data-icon="filePlus"></svg></button>
        <button class="icon-btn" id="openProjBtn" data-tip="Open a saved project (Ctrl+Shift+O)" aria-label="Open project"><svg data-icon="folder"></svg></button>
        <button class="icon-btn" id="saveProjBtn" data-tip="Save this edit as a project to finish later (Ctrl+S)" aria-label="Save project" disabled><svg data-icon="save"></svg></button>
        <button class="icon-btn" id="keysBtn" aria-label="Keyboard shortcuts" data-tip-html="keys"><svg data-icon="info"></svg></button>
        <span class="update-pill" id="updatePill" hidden></span>
        <button class="btn" id="addBtn"><svg data-icon="plus"></svg><span>Add clips</span></button>
        <button class="btn btn-primary" id="exportBtn" disabled><svg data-icon="export"></svg><span>Export</span></button>
      </div>
    </header>

    <main class="stage">
      <div class="viewer" id="viewer">
        <div class="frame" id="frame"><video id="video" preload="auto" playsinline></video></div>
        <div class="viewer-empty" id="viewerEmpty">
          <div class="drop-card">
            <svg data-icon="film"></svg>
            <h1>Drop videos here</h1>
            <p>Trim them, put them in order, export one video.</p>
            <div class="drop-actions">
              <button class="btn btn-primary" id="chooseBtn"><svg data-icon="plus"></svg><span>Choose files</span></button>
              <button class="btn" id="restoreBtn" hidden><svg data-icon="undo"></svg><span>Restore last edit</span></button>
            </div>
          </div>
        </div>
        <div class="viewer-note" id="viewerNote" hidden></div>
      </div>
      <div class="transport">
        <div class="transport-buttons">
          <button class="icon-btn" id="prevFrameBtn" data-tip="Back one frame (←)" aria-label="Back one frame"><svg data-icon="stepBack"></svg></button>
          <button class="icon-btn play" id="playBtn" aria-label="Play"><svg data-icon="play"></svg></button>
          <button class="icon-btn" id="nextFrameBtn" data-tip="Forward one frame (→)" aria-label="Forward one frame"><svg data-icon="stepFwd"></svg></button>
        </div>
        <div class="timecode" aria-live="off">
          <span class="tc" id="tcNow"></span>
          <span class="tc-sep">/</span>
          <span class="tc tc-total" id="tcTotal"></span>
        </div>
        <div class="transport-tools">
          <label class="shape">
            <svg data-icon="crop"></svg>
            <span class="sr-only">Shape</span>
            <select id="shapeSel">
              <option value="orig">Original shape</option>
              <option value="16:9">16:9 Landscape</option>
              <option value="9:16">9:16 Vertical</option>
              <option value="1:1">1:1 Square</option>
              <option value="4:5">4:5 Portrait</option>
            </select>
          </label>
          <button class="toggle" id="fitBtn2" aria-pressed="false" hidden><span>Fill</span></button>
          <span class="info" tabindex="0" role="note" aria-label="About shape" data-tip="The shape of the finished video. Pick 9:16 for TikTok, Reels and Shorts. Fill crops the picture to fit; otherwise you get black bars."><svg data-icon="info"></svg></span>
        </div>
      </div>
    </main>

    <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the timeline" data-tip="Drag to make the timeline taller or shorter. Double-click to reset."></div>

    <section class="timeline" aria-label="Timeline">
      <div class="clipbar" id="clipBar"></div>
      <div class="overview" id="overview" aria-label="Whole edit overview: drag to move, pull the edges to zoom"></div>
      <div class="timeline-scroll" id="tlScroll">
        <div class="timeline-inner" id="tlInner">
          <div class="ruler" id="ruler"></div>
          <div class="track" id="track">
            <div class="track-empty" id="trackEmpty">Videos line up here</div>
          </div>
          <div class="track atrack" id="atrack">
            <div class="track-empty" id="atrackEmpty">Drop music or sound here</div>
          </div>
          <div class="insert-mark" id="insertMark" hidden></div>
          <div class="playhead" id="playhead"><span class="playhead-cap"></span></div>
        </div>
      </div>
    </section>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div><svg data-icon="film"></svg><strong>Drop to add clips</strong></div>
  </div>

  <template id="keysTip">
    <div class="keys">
      <kbd>Space</kbd><span>Play / pause</span>
      <kbd>S</kbd><span>Split at the playhead</span>
      <kbd>I</kbd><kbd class="k2">O</kbd><span>Trim start / end to the playhead</span>
      <kbd>Del</kbd><span>Remove the clip</span>
      <kbd>← →</kbd><span>One frame (hold Shift: 1 second)</span>
      <kbd>+ / −</kbd><span>Zoom the timeline in / out</span>
      <kbd>Z</kbd><span>Zoom to the selected clip</span>
      <kbd>\</kbd><span>Show the whole edit</span>
      <kbd>Ctrl Z</kbd><span>Undo</span>
      <kbd>Ctrl N</kbd><span>New edit</span>
      <kbd>Ctrl S</kbd><span>Save project</span>
      <kbd>Ctrl E</kbd><span>Export</span>
    </div>
  </template>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <dialog class="export" id="exportDlg" aria-labelledby="exportTitle"></dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
